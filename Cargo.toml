[package]
name = "gnss-qc"
version = "0.4.0"
license = "MPL-2.0"
authors = ["Guillaume W. Bres <guillaume.bressaix@gmail.com>"]
description = "GNSS data Quality Control"
homepage = "https://github.com/nav-solutions"
repository = "https://github.com/nav-solutions/gnss-qc"
keywords = ["geo", "gnss", "gps"]
categories = ["science", "science::geo"]
edition = "2021"

[package.metadata]
msrv = "1.82"

[package.metadata.docs.rs]
features = ["sp3", "flate2", "navigation"]
rustdoc-args = ["--cfg", "docrs", "--generate-link-to-definition"]

[features]
# Supports SP3 files by default
# Support Gzip compressed files by default
default = ["sp3", "flate2"]

# Support Gzip compressed files natively
flate2 = [
    "rinex/flate2",
    "sp3?/flate2",
]

# Unlock support of high precision SP3 files.
# When targetting highest precision analysis and solutions, like in PPP,
# Otherwise, your processing (and possible navigation) only relies on RINEX.
sp3 = ["dep:sp3"]

# Unlock Post Processed Navigation.
# Without this option, you are limited to context setup & analysis (basic processing).
# This option unlocks most advanced solvers.
navigation = [
    "dep:anise",
    "rinex/nav",
    "sp3?/anise",
    "dep:log",
]

# Unlock "embedded ephemeris" option,
# which removes the need of Internet access on very first (ever) deployment
# in order to obtain the ANISE database
embed_ephem = [
    "dep:anise",
    "anise/embed_ephem",
]

# Unlock graphical analysis (plots rendering), otherwise reports are solely text based
# plot = [
#     "dep:plotly", 
# ]

[dependencies.rinex]
git = "https://github.com/nav-solutions/rinex"
rev = "55b21881f4a9d4e4d1939bfcfc79ce2c41193fc2"
# path = "/hdd/git/nav-sls/rinex"
features = [
    "qc", 
    "processing", 
    "obs", 
    "nav", 
    "ut1", 
    "meteo", 
    "clock", 
    "antex", 
    "serde",
]

[dependencies.sp3]
# path = "/hdd/git/nav-sls/sp3"
git = "https://github.com/nav-solutions/sp3"
rev = "fa1eb6c7bc98905b5a200e8dfa4719ff79f6ebf6"
optional = true
features = ["qc", "processing", "serde"]

[dependencies.gnss-rs]
git = "https://github.com/nav-solutions/gnss"
rev = "83b2b9397d05a59a9d06b0ddf1fab73c7f1ab1c1"
features = ["std", "domes", "cospar", "sbas"]

[dependencies.gnss-qc-traits]
git = "https://github.com/nav-solutions/qc-traits"
rev = "3fddd9f447629e691538ed903790e9aeb09f92ef"
optional = true
features = ["html"]

[dependencies]
thiserror = "2"
maud = "0.26"
plotly = "0.12"
strum = "0.27"
strum_macros = "0.26"
itertools = "0.14"
log = { version = "0.4", optional = true }
anise = { version = "0.9", optional = true }
hifitime = { version = "4.2", features = ["serde", "std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
