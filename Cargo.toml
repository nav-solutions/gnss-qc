[package]
name = "gnss-qc"
version = "0.4.0"
license = "MPL-2.0"
authors = ["Guillaume W. Bres <guillaume.bressaix@gmail.com>"]
description = "GNSS data Quality Control"
homepage = "https://github.com/nav-solutions"
repository = "https://github.com/nav-solutions/gnss-qc"
keywords = ["geo", "gnss", "gps"]
categories = ["science", "science::geo"]
edition = "2021"

[package.metadata]
msrv = "1.82"

[package.metadata.docs.rs]
features = ["sp3", "nav", "cggtts"]
rustdoc-args = ["--cfg", "docrs", "--generate-link-to-definition"]

[features]
default = ["sp3", "log"]

# Verbose logs
log = ["dep:log"]

serde = [
  "dep:serde",
  "hifitime/serde",
  "gnss-rs/serde",
  "rinex/serde",
  "sp3?/serde",
]

# Unlock support of high precision SP3 files.
sp3 = ["dep:sp3"]

# Navigation (work in progress): gnss-rtk integration comes in a dedicated patch.
navigation = ["dep:anise"]

[dependencies.rinex]
git = "https://github.com/nav-solutions/rinex"
rev = "a10b41abb0ccd6b804dff6acd560992cdcd4c639"
features = [
    "qc",
    "processing",
    "obs",
    "nav",
    "meteo",
    "clock",
    "antex",
    "flate2",
]

[dependencies.sp3]
git = "https://github.com/nav-solutions/sp3"
rev = "0ac81cff95466eb6a3f5c7654e278d12ada4aeb8"
optional = true
features = ["qc", "processing", "flate2"]

[dependencies]
thiserror = "2"
itertools = "0.14"
log = { version = "0.4", optional = true }
# Pinned: rinex@a10b41a does not build against gnss-rs >= 2.6
gnss-rs = { version = "=2.5.0" }
hifitime = { version = "4.1", features = ["std"] }
gnss-qc-traits = { version = "=0.4.0", features = ["processing"] }
anise = { version = "0.5.3", optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
