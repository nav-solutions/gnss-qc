[package]
name = "gnss-qc"
version = "0.7.0"
license = "MPL-2.0"
authors = ["Guillaume W. Bres <guillaume.bressaix@gmail.com>"]
description = "GNSS data Quality Control"
homepage = "https://github.com/nav-solutions"
repository = "https://github.com/nav-solutions/gnss-qc"
keywords = ["geo", "gnss", "gps"]
categories = ["science", "science::geo"]
edition = "2021"

[package.metadata]
msrv = "1.82"

[package.metadata.docs.rs]
features = ["sp3", "flate2", "navigation"]
rustdoc-args = ["--cfg", "docrs", "--generate-link-to-definition"]

[features]
# Supports SP3 files by default
# Support Gzip compressed files by default
default = ["sp3", "flate2", "cggtts"]

# Verbose logs
log = ["dep:log"]

# Serialization of the input configuration, indexing and output stream
serde = ["dep:serde", "gnss-rtk?/serde", "cggtts?/serde", "ionex?/serde"]

# Support Gzip compressed files natively
flate2 = [
    "rinex/flate2",
    "sp3?/flate2",
    "ionex?/flate2",
]

# Unlock support of high precision SP3 files.
# When targetting highest precision analysis and solutions, like in PPP,
# Otherwise, your processing (and possible navigation) only relies on RINEX.
sp3 = ["dep:sp3"]

# Unlock Post Processed Navigation.
# Without this option, you are limited to context setup & analysis (basic processing).
# This option unlocks most advanced solvers.
# Relies on the GNSS-RTK solver (anise v0.10).
navigation = [
    "dep:anise",
    "dep:gnss-rtk",
    "log",
]

# CGGTTS solutions (common view time transfer): P.V.T solutions (SPP, CPP, PPP)
# post-fitted over standardized tracking periods, with the CGGTTS library.
cggtts = [
    "navigation",
    "dep:cggtts",
]

# IONEX files (TEC maps): inputs, TEC maps analysis and temporal interpolation,
# Ionospheric Pierce Points (IPP) of the lines of sight, with the IONEX library.
ionex = [
    "dep:ionex",
]

# Unlock "embedded ephemeris" option,
# which removes the need of Internet access on very first (ever) deployment
# in order to obtain the ANISE database
embed_ephem = [
    "navigation",
    "anise/embed_ephem",
]

[dependencies.rinex]
version = "0.25.0-alpha"
features = [
    "qc", 
    "processing", 
    "obs", 
    "ut1", 
    "meteo", 
    "clock", 
    "antex", 
    "serde",
]

[dependencies]
thiserror = "2"
maud = "0.26"
plotly = "0.12"
strum = "0.27"
strum_macros = "0.26"
itertools = "0.14.0"
gnss-rtk = { version = "0.9", optional = true }
log = { version = "0.4", optional = true }
anise = { version = "0.10", optional = true }
cggtts = { version = "4", optional = true, features = ["tracker", "scheduler"] }
ionex = { version = "0.2", optional = true, default-features = false }
gnss-rs = { version = "2", features = ["serde"] }
hifitime = { version = "4", features = ["serde", "std"] }
gnss-qc-traits = { version = "0.6", features = ["processing"] }
sp3 = { version = "1.5", optional = true, features = ["serde", "qc", "processing"] }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[example]]
name = "context"
required-features = ["sp3"]

[[example]]
name = "miso"

[[example]]
name = "realtime"

[[example]]
name = "spp"
required-features = ["navigation", "sp3"]

[[example]]
name = "cpp"
required-features = ["navigation", "sp3"]

[[example]]
name = "ppp"
required-features = ["navigation", "sp3"]

[[example]]
name = "rtk_ppp"
required-features = ["navigation", "sp3"]

[[example]]
name = "cggtts"
required-features = ["cggtts", "sp3"]

[[example]]
name = "ipp"
required-features = ["ionex", "sp3"]

[[example]]
name = "clock_residuals"
required-features = ["sp3"]

[[example]]
name = "tec_maps"
required-features = ["ionex"]

[[example]]
name = "precise_clocks"

[[example]]
name = "meteo"

[[example]]
name = "observation_residuals"

[[example]]
name = "orbit_residuals"
required-features = ["sp3"]
